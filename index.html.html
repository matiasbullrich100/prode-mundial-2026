<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a5c2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prode 2026">
<meta name="description" content="Prode Mundial FIFA 2026">
<title>Prode Mundial 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--field:#1a5c2a;--field-dark:#143f1e;--field-light:#1e6b31;--gold:#BA7517;--silver:#888780;--bronze:#854F0B;--accent:#EF9F27}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
.screen{display:none}.screen.active{display:block}

/* AUTH */
.auth-wrap{padding:1.25rem}
.auth-hero{background:var(--field);padding:2.5rem 1.25rem 2rem;border-radius:16px;text-align:center;margin-bottom:1.25rem}
.auth-ball{font-size:48px;margin-bottom:.5rem}
.auth-title{font-size:24px;font-weight:600;color:#fff}
.auth-title span{color:#EF9F27}
.auth-sub{font-size:13px;color:#9FE1CB;margin-top:.25rem}
.auth-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:1.25rem}
.auth-tabs{display:flex;border-bottom:1px solid #e5e7eb;margin-bottom:1.25rem}
.auth-tab{flex:1;padding:.65rem;font-size:14px;font-weight:500;color:#6b7280;background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.auth-tab.active{color:var(--field);border-bottom-color:var(--field)}
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px;font-weight:500}
.fg input[type=email],.fg input[type=text]{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:#111}
.fg input:focus{outline:none;border-color:var(--field);box-shadow:0 0 0 3px rgba(26,92,42,.1)}
.pin-row{display:flex;gap:8px;justify-content:center;align-items:center;margin:.5rem 0;flex-wrap:nowrap}
.pin-row input{width:46px;height:50px;text-align:center;font-size:20px;font-weight:600;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#111;font-family:inherit;flex-shrink:0}
.pin-row input:focus{border-color:var(--field);outline:none;box-shadow:0 0 0 3px rgba(26,92,42,.1)}
.pin-eye{width:46px;height:50px;background:#f9fafb;border:1px solid #d1d5db;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7280;flex-shrink:0;padding:0}
.pin-eye:hover{background:#f3f4f6;color:#374151}
.auth-btn{width:100%;padding:12px;background:var(--field);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.auth-btn:hover{background:var(--field-dark)}
.auth-btn:active{transform:scale(.98)}
.err-msg{background:#fef2f2;color:#991b1b;border-radius:10px;padding:.65rem .85rem;font-size:13px;margin-bottom:.85rem;display:none;border:1px solid #fecaca}

/* HEADER */
.hero{background:var(--field);padding:1rem 1rem .85rem}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between}
.hero-title{font-size:20px;font-weight:700;color:#fff;letter-spacing:.2px}
.hero-title span{color:#EF9F27}
.hero-sub{font-size:11px;color:#9FE1CB;margin-top:1px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:.85rem;padding-top:.85rem;border-top:1px solid rgba(255,255,255,.15)}
.hstat{text-align:center}
.hstat-val{font-size:18px;font-weight:700;color:#fff}
.hstat-lbl{font-size:10px;color:#9FE1CB;margin-top:1px;text-transform:uppercase;letter-spacing:.5px}
.logout-btn{padding:6px 10px;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:transparent;color:rgba(255,255,255,.8);cursor:pointer;font-size:13px;font-family:inherit;display:flex;align-items:center;gap:4px}
.logout-btn:hover{background:rgba(255,255,255,.1)}

/* BOTTOM NAV */
.bottom-nav{display:flex;background:var(--field-dark)}
.bnav-btn{flex:1;padding:.7rem 0;font-size:11px;color:rgba(255,255,255,.5);background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;font-weight:500;letter-spacing:.3px;text-transform:uppercase}
.bnav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.bnav-btn.active{color:#EF9F27}

/* CONTENT */
.content{padding:1rem}

/* PILLS */
.phase-strip{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.25rem;margin-bottom:1rem;scrollbar-width:none}
.phase-strip::-webkit-scrollbar{display:none}
.phase-pill{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid #d1d5db;color:#6b7280;background:#fff;cursor:pointer;font-family:inherit;letter-spacing:.2px}
.phase-pill.active{background:var(--field);color:#fff;border-color:var(--field)}

/* NOTICES */
.notice{padding:.65rem .85rem;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:.85rem}
.notice.green{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.notice.amber{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.notice.red{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.notice svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* MATCH CARDS */
.match-card{border:1px solid #e5e7eb;border-radius:12px;padding:.75rem .85rem;margin-bottom:.6rem;background:#fff}
.match-meta{font-size:11px;font-weight:600;color:#1a5c2a;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.5rem}
.match-info{font-size:11px;color:#9ca3af;margin-bottom:.6rem;display:flex;align-items:center;gap:6px}
.match-info span{display:flex;align-items:center;gap:3px}
.match-teams{display:grid;grid-template-columns:1fr 80px;gap:0;margin-bottom:.4rem}
.match-team-row{display:flex;align-items:center;gap:8px;padding:.25rem 0}
.match-team-row+.match-team-row{border-top:1px solid #f3f4f6}
.team-flag{font-size:22px;line-height:1;flex-shrink:0}
.team-flag.right{text-align:right}
.team-name{font-size:13px;font-weight:600;color:#111;line-height:1.3;flex:1}
.team-name.right{text-align:right}
.vs-col{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:.25rem 0}
.score-row{display:flex;align-items:center;justify-content:center;gap:5px}
.score-row input{width:40px;height:38px;text-align:center;font-size:17px;font-weight:600;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#111;font-family:inherit}
.score-row input:focus{border-color:var(--field);outline:none;box-shadow:0 0 0 3px rgba(26,92,42,.1)}
.score-sep{font-size:18px;color:#9ca3af;font-weight:500}
.static-score{font-size:20px;font-weight:700;color:#111;text-align:center;letter-spacing:1px}
.match-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:.4rem}
.pts-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.pts-4{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.pts-2{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.pts-0{background:#f9fafb;color:#6b7280;border:1px solid #e5e7eb}
.real-badge{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}

.save-btn{width:100%;padding:13px;background:var(--field);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:.75rem;display:flex;align-items:center;justify-content:center;gap:8px}
.save-btn:hover{background:var(--field-dark)}
.save-btn:active{transform:scale(.98)}
.save-ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:10px;padding:.65rem;font-size:13px;text-align:center;margin-top:.6rem;display:none;font-weight:500}

/* RANKING */
.metrics-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.85rem}
.metric{background:#f9fafb;border-radius:10px;padding:.85rem;text-align:center;border:1px solid #e5e7eb}
.metric-val{font-size:24px;font-weight:700;color:#111}
.metric-lbl{font-size:11px;color:#6b7280;margin-top:2px;font-weight:500}
.divider{height:1px;background:#e5e7eb;margin:.85rem 0}
.rank-table{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
.rank-header{display:grid;grid-template-columns:32px 1fr 44px 52px 52px;gap:4px;padding:.6rem .85rem;background:#f9fafb;border-bottom:1px solid #e5e7eb}
.rank-header span{font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.3px;text-align:center}
.rank-header span:nth-child(2){text-align:left}
.rank-row{display:grid;grid-template-columns:32px 1fr 44px 52px 52px;gap:4px;align-items:center;padding:.65rem .85rem;border-bottom:1px solid #f3f4f6}
.rank-row:last-child{border-bottom:none}
.rank-row.me{background:#f0fdf4}
.rpos{font-size:15px;font-weight:700;text-align:center}
.rpos.gold{color:#BA7517}.rpos.silver{color:#9ca3af}.rpos.bronze{color:#92400e}
.rnick{font-size:13px;font-weight:600;color:#111}
.ryou{font-size:10px;color:var(--field);font-weight:500;display:block}
.rval{font-size:13px;text-align:center;color:#6b7280;font-weight:500}
.rval.pts{font-size:15px;font-weight:700;color:#111}

/* CONTACT */
.contact-card{border:1px solid #e5e7eb;border-radius:12px;padding:1.1rem;background:#fff;margin-bottom:.85rem}
.contact-title{font-size:15px;font-weight:600;color:#111;margin-bottom:.25rem}
.contact-sub{font-size:13px;color:#6b7280;margin-bottom:1rem;line-height:1.5}
textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;font-family:inherit;resize:vertical;min-height:100px;color:#111;background:#fff}
textarea:focus{outline:none;border-color:var(--field);box-shadow:0 0 0 3px rgba(26,92,42,.1)}
.send-btn{width:100%;padding:12px;background:var(--field);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:.75rem}
.send-btn:hover{background:var(--field-dark)}
.send-btn:disabled{opacity:.6;cursor:not-allowed}

/* ADMIN */
.admin-tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.admin-tab-btn{padding:6px 14px;border:1px solid #d1d5db;border-radius:20px;font-size:12px;font-weight:600;background:#fff;color:#6b7280;cursor:pointer;font-family:inherit}
.admin-tab-btn.active{background:var(--field);color:#fff;border-color:var(--field)}
.section-lbl{font-size:13px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.65rem}
.admin-block{border:1px solid #e5e7eb;border-radius:12px;padding:.75rem;margin-bottom:.85rem}
.admin-match{display:grid;grid-template-columns:1fr 44px 1fr;gap:6px;align-items:center;padding:.5rem 0;border-bottom:1px solid #f3f4f6}
.admin-match:last-child{border-bottom:none}
.admin-match input[type=text]{width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;color:#111;background:#fff}
.admin-match input[type=number]{width:38px;height:34px;text-align:center;font-size:14px;font-weight:600;border:1px solid #d1d5db;border-radius:8px;font-family:inherit;color:#111;background:#fff}
.admin-vs{text-align:center;font-size:11px;color:#9ca3af;font-weight:500}
.green-btn{padding:8px 16px;background:var(--field);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;margin-top:.5rem}
.green-btn:hover{background:var(--field-dark)}
.phase-lbl{font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.4rem;margin-top:.25rem}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:3rem;flex-direction:column;gap:.75rem}
.spinner{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:var(--field);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:14px;color:#6b7280}
</style>
</head>
<body>
<div class="app" id="app">

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="auth-wrap">
    <div class="auth-hero">
      <div class="auth-ball">⚽</div>
      <div class="auth-title">Prode <span>Mundial 2026</span></div>
      <div class="auth-sub">USA · Canadá · México · FIFA World Cup</div>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-in" onclick="authTab('in')">Ingresar</button>
        <button class="auth-tab" id="tab-up" onclick="authTab('up')">Registrarse</button>
      </div>
      <div id="err-msg" class="err-msg"></div>
      <div id="form-in">
        <div class="fg"><label>Email</label><input type="email" id="in-email" placeholder="vos@email.com" autocomplete="email"></div>
        <div class="fg"><label>PIN de 4 dígitos</label>
          <div class="pin-row">
              <input type="password" inputmode="numeric" maxlength="1" id="pi1" oninput="pn(this,'pi2')" onkeydown="pb(event,this,null)">
              <input type="password" inputmode="numeric" maxlength="1" id="pi2" oninput="pn(this,'pi3')" onkeydown="pb(event,this,'pi1')">
              <input type="password" inputmode="numeric" maxlength="1" id="pi3" oninput="pn(this,'pi4')" onkeydown="pb(event,this,'pi2')">
              <input type="password" inputmode="numeric" maxlength="1" id="pi4" oninput="pn(this,null)" onkeydown="pb(event,this,'pi3')">
              <button type="button" onclick="togglePin('pi')" style="width:46px;height:50px;background:#f9fafb;border:1px solid #d1d5db;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7280;flex-shrink:0;padding:0">
                <svg id="eye-pi" viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
          </div>
        </div>
        <button class="auth-btn" onclick="doLogin()">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Entrar
        </button>
      </div>
      <div id="form-up" style="display:none">
        <div class="fg"><label>Email</label><input type="email" id="up-email" placeholder="vos@email.com" autocomplete="email"></div>
        <div class="fg"><label>Apodo (se muestra en el ranking)</label><input type="text" id="up-nick" placeholder="ej: El Tano" maxlength="20"></div>
        <div class="fg"><label>PIN de 4 dígitos</label>
          <div class="pin-row">
              <input type="password" inputmode="numeric" maxlength="1" id="pr1" oninput="pn(this,'pr2')" onkeydown="pb(event,this,null)">
              <input type="password" inputmode="numeric" maxlength="1" id="pr2" oninput="pn(this,'pr3')" onkeydown="pb(event,this,'pr1')">
              <input type="password" inputmode="numeric" maxlength="1" id="pr3" oninput="pn(this,'pr4')" onkeydown="pb(event,this,'pr2')">
              <input type="password" inputmode="numeric" maxlength="1" id="pr4" oninput="pn(this,null)" onkeydown="pb(event,this,'pr3')">
              <button type="button" onclick="togglePin('pr')" style="width:46px;height:50px;background:#f9fafb;border:1px solid #d1d5db;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7280;flex-shrink:0;padding:0">
                <svg id="eye-pr" viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
          </div>
        </div>
        <button class="auth-btn" onclick="doRegister()">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          Crear cuenta
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="screen-main" class="screen">
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-title">⚽ Prode <span>2026</span></div>
        <div class="hero-sub" id="hero-sub">FIFA World Cup</div>
      </div>
      <button class="logout-btn" onclick="doLogout()">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Salir
      </button>
    </div>
    <div class="hero-stats">
      <div class="hstat"><div class="hstat-val" id="hs-pos">—</div><div class="hstat-lbl">Posición</div></div>
      <div class="hstat"><div class="hstat-val" id="hs-pts">0</div><div class="hstat-lbl">Puntos</div></div>
      <div class="hstat"><div class="hstat-val" id="hs-nick">—</div><div class="hstat-lbl">Apodo</div></div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="bnav-btn active" id="bn-prode" onclick="mainTab('prode')">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Pronósticos
    </button>
    <button class="bnav-btn" id="bn-ranking" onclick="mainTab('ranking')">
      <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
      Ranking
    </button>
    <button class="bnav-btn" id="bn-contacto" onclick="mainTab('contacto')">
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Consultas
    </button>
  </div>
  <div class="content">
    <div id="tab-prode"></div>
    <div id="tab-ranking" style="display:none"></div>
    <div id="tab-contacto" style="display:none"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen">
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-title">⚽ <span>Admin</span> Panel</div>
        <div class="hero-sub">Gestión del prode</div>
      </div>
      <button class="logout-btn" onclick="doLogout()">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Salir
      </button>
    </div>
  </div>
  <div class="content">
    <div class="admin-tabs">
      <button class="admin-tab-btn active" id="at-fixture" onclick="adminTab('fixture')">Fixture</button>
      <button class="admin-tab-btn" id="at-results" onclick="adminTab('results')">Resultados</button>
      <button class="admin-tab-btn" id="at-api" onclick="adminTab('api')">API Key</button>
    </div>

async function fbGet(docId) {

}

// PIN HELPERS
window.pn = (el, nid) => { if(el.value.length===1 && nid) document.getElementById(nid).focus(); };
window.pb = (e, el, pid) => { if(e.key==='Backspace' && el.value==='' && pid) document.getElementById(pid).focus(); };
function pin(p) { return [1,2,3,4].map(i=>document.getElementById(p+i).value).join(''); }
function showErr(m) { const e=document.getElementById('err-msg'); e.textContent=m; e.style.display='block'; }
function hideErr() { const e=document.getElementById('err-msg'); if(e) e.style.display='none'; }

window.authTab = (t) => {
  ['in','up'].forEach(x => {
    document.getElementById('tab-'+x).classList.toggle('active', x===t);
    document.getElementById('form-'+x).style.display = x===t ? 'block' : 'none';
  });
  hideErr();
};

window.doLogin = async () => {
  hideErr();
  const email = document.getElementById('in-email').value.trim().toLowerCase();
  const p = pin('pi');
  if(!email || p.length<4) { showErr('Completá todos los campos.'); return; }
  if(!DB.users[email]) { showErr('No existe cuenta con ese email.'); return; }
  if(DB.users[email].pin !== p) { showErr('PIN incorrecto.'); return; }
  S.cur = email;
  showScreen(DB.users[email].isAdmin ? 'admin' : 'main');
};

window.doRegister = async () => {
  hideErr();
  const email = document.getElementById('up-email').value.trim().toLowerCase();
  const nick = document.getElementById('up-nick').value.trim();
  const p = pin('pr');
  if(!email || !nick || p.length<4) { showErr('Completá todos los campos.'); return; }
  if(!/\S+@\S+\.\S+/.test(email)) { showErr('Email inválido.'); return; }
  if(!/^\d{4}$/.test(p)) { showErr('El PIN debe ser 4 dígitos numéricos.'); return; }
  if(DB.users[email]) { showErr('Ya existe una cuenta con ese email.'); return; }
  const first = Object.keys(DB.users).length === 0;
  DB.users[email] = {nick, pin:p, isAdmin:first};
  await saveUsers();
  S.cur = email;
  showScreen(first ? 'admin' : 'main');
};

window.doLogout = () => { S.cur = null; showScreen('login'); };

function showScreen(s) {
  ['login','main','admin'].forEach(x => document.getElementById('screen-'+x).classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
  if(s === 'main') initMain();
  if(s === 'admin') renderAdmin();
}

function calcPts(pk, res) {
  if(!pk || pk.h==='' || pk.a==='' || !res) return 0;
  const ph=parseInt(pk.h), pa=parseInt(pk.a), rh=parseInt(res.h), ra=parseInt(res.a);
  const pw=ph>pa?'H':ph<pa?'A':'D', rw=rh>ra?'H':rh<ra?'A':'D';
  let pts=0; if(pw===rw) pts+=2; if(ph===rh && pa===ra) pts+=2; return pts;
}

function userScore(email) {
  const picks = DB.picks[email] || {};
  let total=0, exact=0, winner=0;
  PHASES.forEach(ph => {
    const res = DB.results[ph.id] || {};
    Object.keys(res).forEach(mid => {
      const pk = picks[mid]; if(!pk) return;
      const pts = calcPts(pk, res[mid]);
      total+=pts; if(pts===4) exact++; if(pts>=2) winner++;
    });
  });
  return {total, exact, winner};
}

function initMain() {
  const u = DB.users[S.cur];
  const sc = userScore(S.cur);
  const allUsers = Object.entries(DB.users).filter(([e,u])=>!u.isAdmin);
  const scores = allUsers.map(([e,u])=>({e,...userScore(e)})).sort((a,b)=>b.total-a.total||b.exact-a.exact);
  const pos = scores.findIndex(s=>s.e===S.cur)+1;
  document.getElementById('hs-nick').textContent = u.nick;
  document.getElementById('hs-pts').textContent = sc.total;
  document.getElementById('hs-pos').textContent = pos ? '#'+pos : '—';
  mainTab(S.mTab);
}

function deadlinePassed(pid) {
  const ph = PHASES.find(p=>p.id===pid); if(!ph) return false;
  const d = new Date(ph.start); d.setDate(d.getDate()-1); d.setHours(23,59,59);
  return new Date() > d;
}

function renderProde() {
  const el = document.getElementById('tab-prode');
  const picks = DB.picks[S.cur] || {};
  const ph = PHASES.find(p=>p.id===S.phase);
  const deadline = new Date(ph.start); deadline.setDate(deadline.getDate()-1);
  const locked = deadlinePassed(S.phase);
  const results = DB.results[S.phase] || {};

  let html = '<div class="phase-strip">';
  PHASES.forEach(p => {
    if((DB.fixture[p.id]||[]).length>0)
      html += `<button class="phase-pill${p.id===S.phase?' active':''}" onclick="setPhase('${p.id}')">${p.name}</button>`;
  });
  html += '</div>';

  if(locked) {
    html += `<div class="notice red"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Fase cerrada — pronósticos en solo lectura</div>`;
  } else {
    const ds = deadline.toLocaleDateString('es-AR',{day:'2-digit',month:'long'});
    html += `<div class="notice amber"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Cierre: ${ds} a las 23:59 hs</div>`;
  }

  const matches = DB.fixture[S.phase] || [];
  matches.forEach(m => {
    const pk = picks[m.id] || {h:'',a:''};
    const res = results[m.id];
    let ptsBadge = '';
    if(res !== undefined && pk.h !== '') {
      const pts = calcPts(pk, res);
      if(pts===4) ptsBadge = '<span class="pts-badge pts-4">✓ +4 pts — exacto</span>';
      else if(pts===2) ptsBadge = '<span class="pts-badge pts-2">+2 pts — acertado</span>';
      else ptsBadge = '<span class="pts-badge pts-0">0 pts</span>';
    }
    const resBadge = res !== undefined ? `<span class="real-badge">Real: ${res.h}-${res.a}</span>` : '';
    html += `<div class="match-card">
      <div class="match-teams">
        <div><div class="team-flag">${m.fh}</div><div class="team-name">${m.home}</div></div>
        <div class="vs-col">
          ${locked || res !== undefined
            ? `<div class="static-score">${pk.h!=='' ? pk.h+'-'+pk.a : '—'}</div>`
            : `<div class="score-row">
                <input type="number" min="0" max="20" value="${pk.h}" id="h_${m.id}" inputmode="numeric">
                <span class="score-sep">-</span>
                <input type="number" min="0" max="20" value="${pk.a}" id="a_${m.id}" inputmode="numeric">
              </div>`
          }
        </div>
        <div style="text-align:right"><div class="team-flag right">${m.fa}</div><div class="team-name right">${m.away}</div></div>
      </div>
      <div class="match-footer">${ptsBadge}${resBadge}</div>
    </div>`;
  });

  if(!locked) {
    html += `<button class="save-btn" onclick="savePicksDB()">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Guardar pronósticos
    </button>
    <div class="save-ok" id="save-ok">✓ Pronósticos guardados correctamente</div>`;
  }
  el.innerHTML = html;
}

function renderRanking() {
  const el = document.getElementById('tab-ranking');

  const me = scores.find(s=>s.email===S.cur);
  const mePos = scores.indexOf(me)+1;

  let html = `<div class="metrics-row">
    <div class="metric"><div class="metric-val">${scores.length}</div><div class="metric-lbl">Participantes</div></div>
    <div class="metric"><div class="metric-val">${mePos||'—'}</div><div class="metric-lbl">Tu posición</div></div>

    html += `<div style="padding:1.25rem;text-align:center;font-size:13px;color:#6b7280">Sin participantes todavía.</div>`;

    scores.forEach((s,i) => {
      const isMe = s.email===S.cur;
      const posClass = i===0?'rpos gold':i===1?'rpos silver':i===2?'rpos bronze':'rpos';
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
      html += `<div class="rank-row${isMe?' me':''}">
        <div class="${posClass}">${medal}</div>
        <div class="rnick">${s.nick}${isMe?'<span class="ryou">(vos)</span>':''}</div>
        <div class="rval">${s.winner}</div>
        <div class="rval">${s.exact}</div>
        <div class="rval pts">${s.total}</div>
      </div>`;
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

window.sendContact = async () => {
  const name = document.getElementById('c-name').value;
  const email = S.cur;
  const msg = document.getElementById('c-msg').value.trim();
  const errEl = document.getElementById('c-err');
  const okEl = document.getElementById('c-ok');
  const btn = document.getElementById('send-btn');
  errEl.style.display='none'; okEl.style.display='none';
  if(!msg) { errEl.textContent='Escribí un mensaje antes de enviar.'; errEl.style.display='flex'; return; }
  btn.disabled=true; btn.textContent='Enviando...';
  try {
    await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {from_name:name, from_email:email, message:msg}, EMAILJS_PUBLIC);
    try { await emailjs.send(EMAILJS_SERVICE, EMAILJS_AUTOREPLY, {to_name:name, to_email:email, message:msg}, EMAILJS_PUBLIC); } catch(e){}
    okEl.style.display='flex';
    document.getElementById('c-msg').value='';
  } catch(e) {
    errEl.textContent='Error al enviar. Intentá de nuevo.'; errEl.style.display='flex';
  }
  btn.disabled=false;
  btn.innerHTML=`<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Enviar consulta`;
};
